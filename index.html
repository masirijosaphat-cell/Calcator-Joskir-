<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOSAPHAT INFO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

header {
    background: #111c32;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #263653;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #aebbd0;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: 25px auto;
}

.card {
    background: #111c32;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    color: #cbd5e1;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #33445f;
    background: #0b1220;
    color: white;
    outline: none;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #1683ff;
    color: white;
}

.btn-success {
    background: #19b86b;
    color: white;
}

.btn-danger {
    background: #e53935;
    color: white;
}

.btn-secondary {
    background: #33445f;
    color: white;
}

.photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 15px auto;
    border: 4px solid #1683ff;
}

.hidden {
    display: none;
}

#message {
    white-space: pre-wrap;
    line-height: 1.7;
    color: #dce6f5;
}

.link-box {
    word-break: break-all;
    background: #080e19;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    color: #6db7ff;
}

.status {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: #18263d;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #7889a3;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>JOSAPHAT INFO</h1>
    <p>Mon espace personnel</p>
</header>


<div class="container">

    <!-- ========================= -->
    <!-- MODE LECTEUR -->
    <!-- ========================= -->

    <div id="readerMode" class="card hidden">

        <h2 id="readerName">Josaphat Kiraku</h2>

        <img id="readerPhoto"
             class="photo hidden"
             alt="Photo">

        <div id="message">
        </div>

        <button class="btn-secondary"
                onclick="retourAccueil()">
            🏠 Accueil
        </button>

    </div>


    <!-- ========================= -->
    <!-- CONNEXION ADMIN -->
    <!-- ========================= -->

    <div id="loginCard" class="card">

        <h2>🔐 Administrateur</h2>

        <p>
            Connecte-toi pour publier tes informations.
        </p>

        <label>Code administrateur</label>

        <input
            type="password"
            id="password"
            placeholder="Entrer le code">

        <button
            class="btn-primary"
            onclick="connexion()">

            🔓 SE CONNECTER

        </button>

        <div id="loginMessage"
             class="status hidden">
        </div>

    </div>


    <!-- ========================= -->
    <!-- ADMIN -->
    <!-- ========================= -->

    <div id="adminCard" class="card hidden">

        <h2>👤 Mon espace</h2>

        <label>Mon nom</label>

        <input
            type="text"
            id="nom"
            placeholder="Ex : Josaphat Kiraku">


        <label>Ma photo</label>

        <input
            type="file"
            id="photo"
            accept="image/*">


        <label>Mon message</label>

        <textarea
            id="texte"
            placeholder="Écris ton message ici...">
        </textarea>


        <button
            class="btn-success"
            onclick="publier()">

            📢 PUBLIER

        </button>


        <button
            class="btn-secondary"
            onclick="chargerDonnees()">

            🔄 CHARGER MES INFORMATIONS

        </button>


        <div id="publication"
             class="hidden">

            <h3>🔗 Adresse de partage</h3>

            <div id="shareLink"
                 class="link-box">
            </div>

            <button
                class="btn-primary"
                onclick="copierLien()">

                📋 COPIER L'ADRESSE

            </button>

            <button
                class="btn-secondary"
                onclick="ouvrirLien()">

                👀 VOIR LA PUBLICATION

            </button>

        </div>

    </div>

</div>


<footer>
    JOSAPHAT INFO © 2026
</footer>


<script>

/* ==========================================
   CODE ADMIN
========================================== */

const CODE_ADMIN = "1234";


/* ==========================================
   VARIABLES
========================================== */

let photoData = "";


/* ==========================================
   CONNEXION
========================================== */

function connexion() {

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if (password === CODE_ADMIN) {

        document
            .getElementById("loginCard")
            .classList.add("hidden");

        document
            .getElementById("adminCard")
            .classList.remove("hidden");

    } else {

        message.textContent =
            "❌ Code incorrect.";

        message.classList.remove("hidden");
    }
}


/* ==========================================
   PHOTO
========================================== */

document
.getElementById("photo")
.addEventListener("change", function() {

    const fichier = this.files[0];

    if (!fichier) return;

    const lecteur = new FileReader();

    lecteur.onload = function(e) {

        photoData = e.target.result;

    };

    lecteur.readAsDataURL(fichier);

});


/* ==========================================
   PUBLICATION
========================================== */

function publier() {

    const nom =
        document.getElementById("nom").value.trim();

    const texte =
        document.getElementById("texte").value.trim();


    if (!nom || !texte) {

        alert(
            "Veuillez entrer votre nom et votre message."
        );

        return;
    }


    const donnees = {

        nom: nom,

        texte: texte,

        photo: photoData

    };


    /* Sauvegarde locale */

    localStorage.setItem(
        "josaphatInfo",
        JSON.stringify(donnees)
    );


    /*
       Transformation des données
       en texte pour le lien
    */

    const contenu =
        btoa(
            encodeURIComponent(
                JSON.stringify(donnees)
            )
        );


    /*
       Création du lien
    */

    const lien =
        window.location.href.split("#")[0]
        + "#publication="
        + contenu;


    document
        .getElementById("shareLink")
        .textContent = lien;


    document
        .getElementById("publication")
        .classList.remove("hidden");


    alert(
        "✅ Publication créée avec succès !"
    );
}


/* ==========================================
   COPIER LE LIEN
========================================== */

function copierLien() {

    const lien =
        document
        .getElementById("shareLink")
        .textContent;


    navigator.clipboard
        .writeText(lien)
        .then(function() {

            alert(
                "✅ Adresse copiée !"
            );

        })
        .catch(function() {

            alert(
                "Copie automatique impossible."
            );

        });
}


/* ==========================================
   OUVRIR PUBLICATION
========================================== */

function ouvrirLien() {

    const lien =
        document
        .getElementById("shareLink")
        .textContent;

    window.open(lien, "_blank");
}


/* ==========================================
   LECTURE DU LIEN
========================================== */

function lirePublication() {

    const hash =
        window.location.hash;


    if (
        !hash.startsWith("#publication=")
    ) {

        return;
    }


    try {

        const contenu =
            hash.replace(
                "#publication=",
                ""
            );


        const donnees =
            JSON.parse(
                decodeURIComponent(
                    atob(contenu)
                )
            );


        /* Cacher administration */

        document
            .getElementById("loginCard")
            .classList.add("hidden");


        document
            .getElementById("adminCard")
            .classList.add("hidden");


        /* Afficher lecteur */

        document
            .getElementById("readerMode")
            .classList.remove("hidden");


        document
            .getElementById("readerName")
            .textContent =
            donnees.nom;


        document
            .getElementById("message")
            .textContent =
            donnees.texte;


        if (donnees.photo) {

            const image =
                document
                .getElementById("readerPhoto");


            image.src =
                donnees.photo;


            image.classList.remove("hidden");

        }

    }

    catch (erreur) {

        alert(
            "❌ Cette publication est invalide."
        );

    }
}


/* ==========================================
   CHARGER DONNÉES
========================================== */

function chargerDonnees() {

    const sauvegarde =
        localStorage.getItem(
            "josaphatInfo"
        );


    if (!sauvegarde) {

        alert(
            "Aucune information enregistrée."
        );

        return;
    }


    const donnees =
        JSON.parse(sauvegarde);


    document
        .getElementById("nom")
        .value =
        donnees.nom;


    document
        .getElementById("texte")
        .value =
        donnees.texte;


    photoData =
        donnees.photo || "";


    alert(
        "✅ Informations chargées."
    );
}


/* ==========================================
   RETOUR ACCUEIL
========================================== */

function retourAccueil() {

    window.location.href =
        window.location.href.split("#")[0];

}


/* ==========================================
   DÉMARRAGE
========================================== */

lirePublication();

</script>

</body>
</html>
<button
    class="btn-success"
    onclick="enregistrerPage()">

    💾 ENREGISTRER SOUS

</button>

<button
    class="btn-primary"
    onclick="partagerLien()">

    📤 PARTAGER LE LIEN

</button>
